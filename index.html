<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Чарджоу, школа №20</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: Georgia, 'Times New Roman', serif; background: #f0ebe0; color: #3a2f1e; padding: 12px; overflow-x: hidden; }
.container { max-width: 1100px; margin: 0 auto; }
header { text-align: center; margin-bottom: 16px; }
header h1 { font-size: 24px; color: #2d4a2d; margin-bottom: 4px; }
header p { font-size: 14px; color: #6b5b3e; font-style: italic; }
.periods { display: flex; justify-content: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
.period-btn { padding: 12px 22px; font-size: 16px; font-family: Georgia, serif; background: #e8dfc8; border: 2px solid #a89468; border-radius: 6px; color: #4a3c1e; cursor: pointer; transition: 0.2s; flex: 1; min-width: 100px; max-width: 160px; }
.period-btn:hover { background: #d8cba8; }
.period-btn.active { background: #4a6b3a; color: #f0ebe0; border-color: #2d4a2d; }
.classroom-wrap { background: #e8dfc8; border: 3px solid #8b7548; border-radius: 8px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden; }
.classroom-scale { width: 100%; overflow: hidden; position: relative; }
.classroom { position: relative; width: 1040px; min-width: 1040px; margin: 0 auto; background: #f5efdc; border-radius: 4px; padding: 25px 20px 20px 40px; box-shadow: inset 0 0 40px rgba(139,117,72,0.15); transform-origin: top left; transition: transform 0.2s; }
.wall-top, .wall-left, .wall-right { position: absolute; background: linear-gradient(180deg, #c9b88a, #a89468); }
.wall-top { top: 0; left: 0; right: 0; height: 12px; border-radius: 4px 4px 0 0; }
.wall-left { top: 0; bottom: 0; left: 0; width: 12px; }
.wall-right { top: 0; bottom: 0; right: 0; width: 12px; }
.blackboard { background: #2d4a2d; border: 8px solid #8b6f3e; border-radius: 4px; height: 85px; margin: 15px 30px 20px 30px; box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; color: rgba(240,235,224,0.7); font-size: 15px; letter-spacing: 3px; position: relative; }
.blackboard::after { content: ''; position: absolute; bottom: 6px; right: 20px; width: 36px; height: 7px; background: #d8cba8; border-radius: 2px; box-shadow: 18px 0 0 #d8cba8, 36px 0 0 #d8cba8; }
.teacher-desk { position: absolute; top: 130px; left: 55px; width: 120px; height: 65px; background: linear-gradient(135deg, #a87b4a, #8b6238); border: 2px solid #6b4a25; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85); font-size: 10px; text-align: center; padding: 4px; }
.door { position: absolute; top: 130px; right: 35px; width: 65px; height: 105px; background: linear-gradient(135deg, #b8935f, #8b6f3e); border: 3px solid #6b4a25; border-radius: 3px 3px 0 0; box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 3px 6px rgba(0,0,0,0.2); }
.door::before { content: ''; position: absolute; top: 14px; left: 9px; right: 9px; height: 32px; background: rgba(180,210,230,0.4); border: 1px solid #6b4a25; border-radius: 2px; }
.door::after { content: ''; position: absolute; top: 58px; right: 7px; width: 8px; height: 8px; background: #d4af37; border-radius: 50%; }
.windows-col { position: absolute; left: 20px; top: 190px; display: flex; flex-direction: column; gap: 55px; }
.window { width: 13px; height: 110px; background: linear-gradient(180deg, #b8d4e8, #8fb8d4); border: 3px solid #a89468; border-radius: 2px; box-shadow: 0 0 20px rgba(180,212,232,0.6); position: relative; }
.window::before { content: ''; position: absolute; top: 50%; left: -3px; right: -3px; height: 3px; background: #a89468; }
.seats-grid { display: flex; gap: 22px; justify-content: center; margin-top: 10px; }
.seat-row { display: flex; flex-direction: column; gap: 8px; }
.desk-pair { display: flex; gap: 3px; background: #a87b4a; border: 2px solid #6b4a25; border-radius: 4px; padding: 3px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
.seat { width: 78px; height: 60px; background: #f5efdc; border: 1px solid #8b7548; border-radius: 3px; cursor: pointer; transition: 0.2s; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 2px; font-size: 10px; color: #3a2f1e; text-align: center; }
.seat:hover { background: #fffbe8; box-shadow: inset 0 0 10px rgba(74,107,58,0.4); }
.seat.taken { background: #dde8d0; border-color: #4a6b3a; }
.seat.taken:hover { background: #c8dcb8; }
.seat-initials { width: 28px; height: 28px; border-radius: 50%; background: #4a6b3a; color: #f0ebe0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-bottom: 2px; }
.seat-name { font-size: 9px; line-height: 1.1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; padding: 0 2px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 12px; overflow-y: auto; }
.modal-overlay.show { display: flex; }
.modal { background: #f5efdc; border: 3px solid #8b7548; border-radius: 8px; padding: 20px; max-width: 480px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.3); max-height: 92vh; overflow-y: auto; }
.modal h2 { color: #2d4a2d; font-size: 20px; margin-bottom: 4px; }
.modal-sub { color: #6b5b3e; font-size: 13px; font-style: italic; margin-bottom: 14px; }
.modal label { display: block; font-size: 14px; font-weight: bold; color: #4a3c1e; margin: 12px 0 4px; }
.modal input[type="text"], .modal textarea { width: 100%; padding: 12px; font-family: Georgia, serif; font-size: 16px; border: 2px solid #a89468; border-radius: 4px; background: #fffbe8; color: #3a2f1e; }
.modal textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
.btn-cancel, .btn-save { padding: 14px 22px; font-family: Georgia, serif; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.2s; flex: 1; min-width: 100px; }
.btn-cancel { background: #e8dfc8; border: 2px solid #a89468; color: #4a3c1e; }
.btn-cancel:hover { background: #d8cba8; }
.btn-save { background: #4a6b3a; border: 2px solid #2d4a2d; color: #f0ebe0; }
.btn-save:hover { background: #3a5a2a; }
.btn-save:disabled { opacity: 0.6; cursor: wait; }
.btn-delete { background: #a04a3a; border: 2px solid #6b2a1a; color: #f0ebe0; padding: 14px 22px; font-family: Georgia, serif; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 8px; }
.btn-delete:hover { background: #8a3a2a; }
.modal-error { color: #a04a3a; font-size: 14px; margin-top: 10px; min-height: 18px; text-align: center; }
.loading { text-align: center; padding: 30px; color: #6b5b3e; font-style: italic; font-size: 15px; }
@media (max-width: 700px) {
  header h1 { font-size: 20px; }
  header p { font-size: 13px; }
  .period-btn { padding: 12px 14px; font-size: 15px; }
  .modal { padding: 16px; }
  .modal h2 { font-size: 18px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Чарджоу, школа №20</h1>
    <p>Наш класс — найдите своё место</p>
  </header>
  <div class="periods">
    <button class="period-btn active" data-period="5">5 класс</button>
    <button class="period-btn" data-period="9">9 класс</button>
    <button class="period-btn" data-period="11">11 класс</button>
  </div>
  <div class="classroom-wrap">
    <div class="classroom-scale" id="classroomScale">
      <div class="classroom" id="classroom">
        <div class="wall-top"></div>
        <div class="wall-left"></div>
        <div class="wall-right"></div>
        <div class="blackboard">Д О С К А</div>
        <div class="teacher-desk">Учительский<br>стол</div>
        <div class="door"></div>
        <div class="windows-col"><div class="window"></div><div class="window"></div><div class="window"></div></div>
        <div class="seats-grid" id="seatsGrid"></div>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Занять место</h2>
    <p class="modal-sub" id="modalSub"></p>
    <label>Имя и фамилия *</label>
    <input type="text" id="inputName" placeholder="Например: Иван Петров" maxlength="60" autocomplete="name">
    <label>Пара слов о себе (необязательно)</label>
    <textarea id="inputComment" placeholder="Например: сидел с Петровым, вечно списывал" maxlength="200"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">Отмена</button>
      <button class="btn-save" id="btnSave">Сесть</button>
    </div>
    <div class="modal-error" id="modalError"></div>
  </div>
</div>
<script>
const DATA_URL = 'https://storage.yandexcloud.net/class-seats-data/seats.json';
const SAVE_URL = 'https://functions.yandexcloud.net/d4etmnh3g1fohitecotg';

let currentPeriod = '5';
let seats = [];
let cache = {};
let editingSeat = null;

const grid = document.getElementById('seatsGrid');
const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const inputName = document.getElementById('inputName');
const inputComment = document.getElementById('inputComment');
const btnSave = document.getElementById('btnSave');
const btnCancel = document.getElementById('btnCancel');
const modalError = document.getElementById('modalError');
const classroom = document.getElementById('classroom');
const classroomScale = document.getElementById('classroomScale');

function fitClassroom() {
  const availW = classroomScale.clientWidth - 8;
  if (availW < 1040) {
    const scale = availW / 1040;
    classroom.style.transform = 'scale(' + scale + ')';
    classroomScale.style.height = (classroom.offsetHeight * scale) + 'px';
  } else {
    classroom.style.transform = 'scale(1)';
    classroomScale.style.height = 'auto';
  }
}
window.addEventListener('resize', fitClassroom);

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    loadSeats();
  });
});

async function loadSeats() {
  if (cache[currentPeriod]) {
    seats = cache[currentPeriod];
    renderGrid();
    refreshInBackground();
    return;
  }
  grid.innerHTML = '<div class="loading">Загружаем места...</div>';
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const all = await res.json();
    seats = (all || []).filter(s => s.period === currentPeriod);
    cache[currentPeriod] = seats;
    renderGrid();
  } catch (err) {
    grid.innerHTML = '<div class="loading">Ошибка загрузки: ' + err.message + '</div>';
  }
}

async function refreshInBackground() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) return;
    const all = await res.json();
    seats = (all || []).filter(s => s.period === currentPeriod);
    cache[currentPeriod] = seats;
    renderGrid();
  } catch (e) {}
}

function renderGrid() {
  grid.innerHTML = '';
  for (let row = 1; row <= 3; row++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'seat-row';
    for (let desk = 1; desk <= 5; desk++) {
      const pairDiv = document.createElement('div');
      pairDiv.className = 'desk-pair';
      ['left', 'right'].forEach(side => pairDiv.appendChild(makeSeat(row, desk, side)));
      rowDiv.appendChild(pairDiv);
    }
    grid.appendChild(rowDiv);
  }
  fitClassroom();
}

function makeSeat(row, desk, side) {
  const seatData = seats.find(s => s.row === row && s.desk === desk && s.side === side);
  const div = document.createElement('div');
  div.className = 'seat' + (seatData ? ' taken' : '');
  if (seatData) {
    const init = document.createElement('div');
    init.className = 'seat-initials';
    init.textContent = (seatData.name || '?').trim().charAt(0).toUpperCase();
    div.appendChild(init);
    const nameEl = document.createElement('div');
    nameEl.className = 'seat-name';
    nameEl.textContent = seatData.name || '';
    div.appendChild(nameEl);
    div.title = seatData.name + (seatData.comment ? ' — ' + seatData.comment : '');
  } else {
    const plus = document.createElement('div');
    plus.style.cssText = 'font-size:22px;color:#a89468;';
    plus.textContent = '+';
    div.appendChild(plus);
    div.title = 'Занять это место';
  }
  div.addEventListener('click', () => openSeat(row, desk, side, seatData));
  return div;
}

function openSeat(row, desk, side, seatData) {
  editingSeat = { row, desk, side, existing: seatData };
  modalError.textContent = '';
  inputName.value = seatData ? (seatData.name || '') : '';
  inputComment.value = seatData ? (seatData.comment || '') : '';
  const sideName = side === 'left' ? 'левое' : 'правое';
  modalSub.textContent = 'Ряд ' + row + ', парта ' + desk + ', ' + sideName + ' место · ' + currentPeriod + ' класс';

  if (seatData) {
    modalTitle.textContent = 'Место занято';
    if (seatData.comment) modalSub.textContent += ' · ' + seatData.comment;
    btnSave.textContent = 'Сохранить';
    showDeleteButton(seatData);
  } else {
    modalTitle.textContent = 'Занять место';
    btnSave.textContent = 'Сесть';
    hideDeleteButton();
  }
  overlay.classList.add('show');
  setTimeout(() => inputName.focus(), 100);
}

function showDeleteButton(seatData) {
  hideDeleteButton();
  const btn = document.createElement('button');
  btn.className = 'btn-delete';
  btn.id = 'btnDelete';
  btn.textContent = 'Освободить это место';
  btn.addEventListener('click', () => deleteSeat(seatData));
  document.querySelector('.modal-actions').prepend(btn);
}

function hideDeleteButton() {
  const b = document.getElementById('btnDelete');
  if (b) b.remove();
}

btnCancel.addEventListener('click', () => overlay.classList.remove('show'));
overlay.addEventListener('click', e => { if (e.target === overlay) btnCancel.click(); });

btnSave.addEventListener('click', async () => {
  const name = inputName.value.trim();
  if (!name) { modalError.textContent = 'Пожалуйста, введите имя'; return; }
  btnSave.disabled = true;
  btnSave.textContent = 'Сохраняем...';
  modalError.textContent = '';
  try {
    await saveSeat({
      period: currentPeriod,
      row: editingSeat.row,
      desk: editingSeat.desk,
      side: editingSeat.side,
      name: name,
      comment: inputComment.value.trim() || null
    });
    overlay.classList.remove('show');
    delete cache[currentPeriod];
    await loadSeats();
  } catch (err) {
    modalError.textContent = 'Ошибка: ' + err.message;
  } finally {
    btnSave.disabled = false;
    btnSave.textContent = editingSeat.existing ? 'Сохранить' : 'Сесть';
  }
});

async function deleteSeat(seatData) {
  if (!confirm('Освободить это место? Имя и комментарий будут удалены.')) return;
  btnSave.disabled = true;
  btnSave.textContent = 'Удаляем...';
  try {
    const all = await getAllSeats();
    const filtered = all.filter(s => !(s.period === seatData.period && s.row === seatData.row && s.desk === seatData.desk && s.side === seatData.side));
    await saveAll(filtered);
    overlay.classList.remove('show');
    delete cache[currentPeriod];
    await loadSeats();
  } catch (err) {
    modalError.textContent = 'Ошибка: ' + err.message;
    btnSave.disabled = false;
    btnSave.textContent = 'Сохранить';
  }
}

async function getAllSeats() {
  const res = await fetch(DATA_URL + '?t=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()) || [];
}

async function saveSeat(newSeat) {
  const all = await getAllSeats();
  const idx = all.findIndex(s => s.period === newSeat.period && s.row === newSeat.row && s.desk === newSeat.desk && s.side === newSeat.side);
  if (idx >= 0) {
    all[idx] = newSeat;
  } else {
    all.push(newSeat);
  }
  await saveAll(all);
}

async function saveAll(all) {
  const res = await fetch(SAVE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ seats: all })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error('Функция вернула ошибку');
}

loadSeats();
</script>
</body>
</html>
